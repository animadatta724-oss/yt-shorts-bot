name: Daily Hindi Short

on:
  schedule:
    - cron: "30 3 * * *"   # 9:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg + Hindi font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: pip install -r requirements.txt
      - name: Generate and upload
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VISUALS: "ai"
          TELEGRAM_APPROVAL: "0"
          APPROVAL_WAIT_MIN: "30"
          AUTO_ON_TIMEOUT: "0"
          SMART_TIME: "1"
          POST_SLOTS: "7,9,12,15,18,20,22"
          PUBLISH_DELAY_HOURS: "0"
          SFX: "1"
          REMAKE: "1"
          REMAKE_AFTER_DAYS: "14"
          SERIES_NAME: "रोचक तथ्य"
          SERIES_TAG: "Fact"
          SERIES_IN_TITLE: "0"
          VOICE: "hi-IN-MadhurNeural"
          NICHE: "amazing facts: space, science, human body, animals, history, India, psychology"
      - name: Save history
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update history" && git pull --rebase && git push)
